<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <script src="html5-qrcode.min.js"></script>
    <script src="xlsx.full.min.js"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f0f2f5; transition: background-color 0.1s; margin: 0; min-height: 100vh;}
        
        #reader-wrapper { position: relative; width: 100%; max-width: 500px; border-radius: 10px; overflow: hidden; background: #000; margin-top: 10px; }
        #reader { width: 100%; }
        
        #scanner-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 120px; border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px; pointer-events: none; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); z-index: 10;
        }
        #scanner-overlay::before, #scanner-overlay::after {
            content: ""; position: absolute; width: 20px; height: 20px; border: 4px solid #007bff;
        }
        #scanner-overlay::before { top: -4px; left: -4px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
        #scanner-overlay::after { bottom: -4px; right: -4px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }

        #dashboard { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        #status { color: #888; font-size: 0.9em; margin-top: 15px; font-weight: bold; height: 20px;}
        
        .counter { font-size: 1.5em; color: #333; margin: 10px 0; }
        .last-scan { color: #28a745; font-weight: bold; font-size: 1.2em; letter-spacing: 1px; min-height: 25px; margin-bottom: 15px;}
        
        /* Style przycisków */
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button { padding: 15px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; width: 100%; box-sizing: border-box; transition: background 0.2s;}
        
        .btn-reg { background: #007bff; margin-bottom: 0px; }
        .btn-reg:hover { background: #0056b3; }

        /* WYŚWIETLANIE STATUSU I NR REJ. */
        #reg-display { font-size: 1.1em; color: #007bff; font-weight: bold; display: none; margin-bottom: 10px; line-height: 1.4; }
        .data-label { color: #555; font-weight: normal; font-size: 0.9em;}

        .btn-excel { background: #28a745; }
        .btn-excel:hover { background: #218838; }
        
        .btn-undo { background: #ffc107; color: #333 ;padding: 8px; font-size: 0.9em; margin-top: 30px;}
        .btn-undo:hover { background: #e0a800; }

        .btn-clear { background: #dc3545; padding: 8px; font-size: 0.9em; margin-top: 10px;}
        .btn-clear:hover { background: #c82333; }

        /* NOWE: Style dla własnego wyskakującego okienka (Modal) */
        .modal-overlay {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background-color: #fff; margin: 30% auto; padding: 25px; 
            width: 85%; max-width: 320px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center; display: flex; flex-direction: column;
        }
        .modal-content h3 { margin-top: 0; color: #333; }
        
        .radio-group { display: flex; justify-content: space-around; margin: 20px 0; font-size: 1.2em; font-weight: bold;}
        .radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #333; }
        .radio-label input { transform: scale(1.3); }

        #modal-input { 
            width: 100%; padding: 12px; margin-bottom: 20px; font-size: 1.2em; 
            text-transform: uppercase; box-sizing: border-box; text-align: center;
            border: 2px solid #ccc; border-radius: 6px;
        }
    </style>
</head>
<body>
    
    <div id="reader-wrapper">
        <div id="reader"></div>
        <div id="scanner-overlay"></div>
    </div>

    <div id="status">Skaner aktywny...</div>

    <div id="dashboard">
        <div class="counter">Zeskanowano: <strong id="scan-count">0</strong> szt.</div>
        <div class="last-scan" id="last-scan-result">---</div>
        
        <div class="btn-group">
            <button class="btn-reg" onclick="openModal()">Wpisz status i nr rej.</button>
            
            <div id="reg-display">
                <span class="data-label">Status:</span> <span id="display-status">---</span><br>
                <span class="data-label">Nr rej:</span> <span id="display-reg">---</span>
            </div>

            <button class="btn-excel" onclick="exportToExcel()">Zapisz plik Excel z kodami</button>
            <h2>  </h2>
            <button class="btn-undo" onclick="undoLastScan()">Usuń ostatnio zeskanowany kod</button>
            <h2>  </h2>
            <button class="btn-clear" onclick="clearData()">Wyzeruj licznik i rozpocznij nowy plik Excel</button>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Wprowadź dane</h3>
            
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="statusWybor" value="DOBRE" checked> DOBRE
                </label>
                <label class="radio-label">
                    <input type="radio" name="statusWybor" value="OTWARTE"> OTWARTE
                </label>
            </div>
            
            <input type="text" id="modal-input" placeholder="Nr rejestracyjny">
            
            <button class="btn-reg" onclick="saveModalData()">Zatwierdź i zamknij</button>
            <button class="btn-undo" onclick="closeModal()">Anuluj</button>
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const statusText = document.getElementById('status');
        const countText = document.getElementById('scan-count');
        const lastScanText = document.getElementById('last-scan-result');
        
        let scannedCodes = [];
        let isPaused = false;
        
        // Zmienne na status i rejestrację
        let currentRegNumber = ""; 
        let currentStatus = "DOBRE"; 

        // Wczytywanie danych z pamięci
        function loadSavedData() {
            const saved = localStorage.getItem('mojeSkany15');
            if (saved) {
                scannedCodes = JSON.parse(saved);
                updateUI();
            }
            
            const savedReg = localStorage.getItem('nrRejestracyjny');
            const savedStatus = localStorage.getItem('statusKodu');
            
            if (savedReg !== null) currentRegNumber = savedReg;
            if (savedStatus !== null) currentStatus = savedStatus;
            
            if(savedReg || savedStatus) {
                updateDisplayData();
            }
        }

        // Zapisywanie kodów do pamięci
        function saveToMemory() {
            localStorage.setItem('mojeSkany15', JSON.stringify(scannedCodes));
        }

        // Aktualizacja kodów na ekranie
        function updateUI() {
            countText.innerText = scannedCodes.length;
            if(scannedCodes.length > 0) {
                lastScanText.innerText = scannedCodes[scannedCodes.length - 1][0];
            } else {
                lastScanText.innerText = "---";
            }
        }

        // Aktualizacja bloku informacyjnego z nr rej i statusem
        function updateDisplayData() {
            document.getElementById('display-status').innerText = currentStatus;
            document.getElementById('display-reg').innerText = currentRegNumber || "Brak";
            document.getElementById('reg-display').style.display = 'block';
        }

        // FUNKCJE MODALA (Wyskakującego okna)
        function openModal() {
            document.getElementById('customModal').style.display = 'block';
            document.getElementById('modal-input').value = currentRegNumber;
            
            // Zaznaczanie odpowiedniego radio buttona
            const radios = document.getElementsByName('statusWybor');
            for(let r of radios) {
                if(r.value === currentStatus) r.checked = true;
            }
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function saveModalData() {
            // Pobieranie statusu z radio buttonów
            const radios = document.getElementsByName('statusWybor');
            for(let r of radios) {
                if(r.checked) currentStatus = r.value;
            }
            
            // Pobieranie wpisanego tekstu
            const inputVal = document.getElementById('modal-input').value;
            currentRegNumber = inputVal.trim().toUpperCase();

            // Zapis w pamięci telefonu
            localStorage.setItem('nrRejestracyjny', currentRegNumber);
            localStorage.setItem('statusKodu', currentStatus);

            // Odśwież UI i zamknij okno
            updateDisplayData();
            closeModal();
        }

        const config = { 
            fps: 15, 
            qrbox: { width: 280, height: 120 },
            aspectRatio: 1.0
        };

        function startScanner() {
            html5QrCode.start({ facingMode: "environment" }, config, (text) => {
                if (isPaused) return;

                if (/^\d{15}$/.test(text)) {
                    processValidCode(text);
                } else {
                    statusText.innerText = "Niepoprawny kod (" + text.length + ")";
                    statusText.style.color = "red";
                }
            }).catch(err => {
                statusText.innerText = "Błąd kamery. Wymagany HTTPS.";
            });
        }

        function processValidCode(code) {
            isPaused = true;
            statusText.innerText = "ZAPISANO!";
            statusText.style.color = "green";

            scannedCodes.push([code]);
            saveToMemory();
            updateUI();

            document.body.style.backgroundColor = '#19ff19';
            if (navigator.vibrate) navigator.vibrate(200);

            setTimeout(() => {
                document.body.style.backgroundColor = '#f0f2f5';
                statusText.innerText = "Skaner aktywny...";
                statusText.style.color = "#888";
                isPaused = false;
            }, 1500);
        }

        function undoLastScan() {
            if (scannedCodes.length === 0) {
                alert("Nie ma żadnych kodów do usunięcia!");
                return;
            }

            const lastCode = scannedCodes[scannedCodes.length - 1][0];

            if (confirm(`Czy usunąć ostatnio zeskanowany kod o nr:\n\n${lastCode} ?`)) {
                scannedCodes.pop(); 
                saveToMemory(); 
                updateUI(); 
                
                statusText.innerText = "Usunięto pomyślnie.";
                statusText.style.color = "#dc3545";
                
                setTimeout(() => {
                    statusText.innerText = "Skaner aktywny...";
                    statusText.style.color = "#888";
                }, 1500);
            }
        }

        function exportToExcel() {
            if (scannedCodes.length === 0) {
                alert("Brak danych do pobrania!");
                return;
            }
            if (currentRegNumber === "") {
                alert("Wpisz nr rejestrcyjny!");
                return;
            }

            const worksheet = XLSX.utils.aoa_to_sheet(scannedCodes);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Zeskanowane Kody");

            const date = new Date();
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            
            // BUDOWANIE NAZWY PLIKU: uwzględnia STATUS oraz NR REJ (jeśli jest podany)
            let filename = `skany_${currentStatus}_`;
            if (currentRegNumber !== "") {
                filename += `${currentRegNumber}_`;
            }
            filename += `${year}-${month}-${day}_${hours}-${minutes}.xlsx`;

            if(confirm(`Plik zostanie zapisany w folderze "Pobrane" (Downloads).\nNazwa pliku:\n${filename}`)) {
                XLSX.writeFile(workbook, filename);
            }
        }

        function clearData() {
            if(confirm("Czy na pewno chcesz usunąć WSZYSTKIE zeskanowane kody z pamięci? Upewnij się, że pobrałeś plik Excel!")) {
                scannedCodes = [];
                currentRegNumber = ""; 
                currentStatus = "DOBRE"; // Powrót do domyślnego
                
                localStorage.removeItem('mojeSkany15');
                localStorage.removeItem('nrRejestracyjny');
                localStorage.removeItem('statusKodu');
                
                document.getElementById('reg-display').style.display = 'none'; 
                updateUI();
            }
        }

        // Start
        loadSavedData();
        startScanner();
    </script>
</body>
</html>
